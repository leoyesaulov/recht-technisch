services:
  api:
    build: api/
    ports:
      - "8080:8080"

  app:
    build: app/
    environment:
      BACKEND_URL: https://recht-technisch-backend-339540402730.europe-west1.run.app
      # PORT is intentionally left unset so the server defaults to 8080,
      # matching Cloud Run's own convention. To proxy real requests locally,
      # the container also needs Application Default Credentials, e.g. by
      # mounting `~/.config/gcloud` after `gcloud auth application-default
      # login` on the host — see README.md.
    ports:
      - "3000:8080"
